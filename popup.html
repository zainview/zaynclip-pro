<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ===== 5) PASSWORD LOCK SCREEN ===== -->
  <div id="lockScreen">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">CLIPBOARD LOCKED</div>
    <input id="lockPass" type="password" placeholder="Passcode">
    <button id="unlockBtn">Unlock</button>
    <div id="lockError"></div>
  </div>

  <div id="appMain">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">📋</div>
        <div class="brand-name">Clipboard Pro</div>
        <div id="syncBadge" title="Cloud sync ON">☁</div>
      </div>
      <input id="search" type="text" placeholder="Search clips..." autofocus>
    </div>
    <div id="list"></div>
    <div id="empty">✨ Nothing here yet — copy something!</div>
    <div class="footer">
      <button id="clear">🗑 Clear</button>
      <button id="floatBtn" title="Floating mode">🪟</button>
      <button id="lockBtn" title="Lock now">🔒</button>
      <button id="options">⚙</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
